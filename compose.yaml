name: medflow-rest-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medflow_rest
      POSTGRES_USER: meduser
      POSTGRES_PASSWORD: ${MEDFLOW_DB_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "meduser", "-d", "medflow_rest"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rest_pgdata:/var/lib/postgresql/data

volumes:
  rest_pgdata:
