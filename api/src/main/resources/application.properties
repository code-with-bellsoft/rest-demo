spring.application.name=medflow-rest-demo
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5434/medflow_rest
spring.datasource.username=meduser
spring.datasource.password=${MEDFLOW_DB_PASSWORD}

spring.jooq.sql-dialect=postgres

spring.mvc.problemdetails.enabled=true

spring.mvc.apiversion.use.header=API-Version
spring.mvc.apiversion.default=1.0
spring.mvc.apiversion.supported=1.0,2.0
